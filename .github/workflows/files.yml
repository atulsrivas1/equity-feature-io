name: Local files qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  files:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 9a180da540a426d9cefb3edb34fc81c26a9bd5d9
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python -m pip install --no-deps --no-build-isolation -e ../core/packages/contracts -e ../core/packages/features -e packages/io-contracts -e packages/io-sdk -e packages/acquisition -e packages/files
        working-directory: component
      - run: python -m pip install --no-deps pyarrow==20.0.0 databento-dbn==0.70.0
        working-directory: component
      - run: python -m mypy --strict packages/files/src examples/files_consumer.py
        working-directory: component
      - run: python -m unittest discover -s tests/files
        working-directory: component
      - run: python tools/build_files.py --core-root ../core
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: files-${{ github.sha }}-${{ matrix.os }}
          path: component/dist-files/
          retention-days: 30
          if-no-files-found: error
