name: Optional DuckDB adapter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  duckdb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 2cd51cd35c0a3081f88e1752c7c1c41ffe0e62af
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-duckdb.txt
        working-directory: component
      - run: python -m pip install --no-build-isolation --no-deps -e ../core/packages/contracts -e ../core/packages/features -e packages/duckdb
        working-directory: component
      - run: python -m pip check
        working-directory: component
      - run: python tools/check_extraction.py --core-root ../core
        working-directory: component
      - run: python -m mypy --strict packages/duckdb/src examples/duckdb_conformance.py
        working-directory: component
      - run: python -m unittest discover -s tests/duckdb
        working-directory: component
      - run: python tools/build_duckdb.py --core-root ../core
        working-directory: component
      - name: Retain qualified optional adapter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ github.sha }}-${{ matrix.os }}
          path: component/dist/duckdb/
          retention-days: 30
          if-no-files-found: error
