name: Repository compatibility matrix
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 45d0fb292234060f8196ba6569ce7805dd921846
          path: core
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-workers
          ref: 8ee8719eda773efef838805475173f2b474488df
          path: workers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python tools/build_matrix.py --core-root ../core --worker-root ../workers
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ github.sha }}-${{ matrix.os }}
          path: component/dist-matrix/
          retention-days: 30
          if-no-files-found: error
