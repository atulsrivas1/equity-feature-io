name: Reproduction bundle qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: ec1e3b1b55a2c3e7e8a7c2ecddc43f11a99c72ca
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python -m pip install --no-deps --no-build-isolation -e ../core/packages/contracts -e ../core/packages/features -e ../core/packages/evidence -e packages/bundles
        working-directory: component
      - run: python -m pip check
        working-directory: component
      - run: python tools/check_bundles.py
        working-directory: component
      - run: python -m mypy --strict packages/bundles/src examples/bundles_consumer.py
        working-directory: component
      - run: python -I -m unittest discover -s tests/bundles
        working-directory: component
      - run: python tools/build_bundles.py --core-root ../core
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ github.sha }}-${{ matrix.os }}
          path: component/dist/bundles/
          retention-days: 30
          if-no-files-found: error
