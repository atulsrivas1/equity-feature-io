name: Shared acquisition qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 4689892117bdf70ef47726c1dee754e3e23b0658
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python -m pip install --no-deps --no-build-isolation -e ../core/packages/contracts -e ../core/packages/features -e packages/io-contracts -e packages/acquisition
        working-directory: component
      - run: python -m mypy --strict packages/acquisition/src examples/acquisition_consumer.py
        working-directory: component
      - run: python -m unittest discover -s tests/acquisition
        working-directory: component
      - run: python tools/build_acquisition.py --core-root ../core
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: acquisition-${{ github.sha }}-${{ matrix.os }}
          path: component/dist-acquisition/
          retention-days: 30
          if-no-files-found: error
