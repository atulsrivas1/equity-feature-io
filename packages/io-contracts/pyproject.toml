[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-io-contracts"
version = "0.1.0a6"
description = "Typed explicit equity I/O factory composition"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-contracts==0.0.4a6"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-feature-io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_io_contracts = ["py.typed", "catalogue/*.json", "catalogue/*.md", "catalogue/*/*.json", "catalogue/*/*.md"]
