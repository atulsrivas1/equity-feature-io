[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-duckdb-sink"
version = "0.1.0a0"
description = "Bounded transactional canonical equity result generations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-io-sdk==0.1.0a2", "duckdb==1.5.6"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-feature-io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_duckdb_sink = ["py.typed"]
